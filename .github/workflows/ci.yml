name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/fusion-rpg-web/package-lock.json

      - name: Numeric-overflow guard (power-plan.md P0.6)
        shell: pwsh
        run: |
          python scripts/audit-overflow.py
          if ($LASTEXITCODE -ne 0) { throw "overflow audit found a critical finding — see output above" }

      - name: Magic-number guard (power-todo.md M.6)
        shell: pwsh
        run: |
          python scripts/audit-magic-numbers.py
          if ($LASTEXITCODE -ne 0) { throw "magic-number audit found an M1/M2 finding — see output above" }

      - name: species-generator staleness guard (seed-to-concrete T4.5/Checkpoint 4)
        shell: pwsh
        run: |
          # species-generator (demon-seed module 12) commits its generated tree
          # (data/generated/demons/**) to the repo — --check regenerates every real classified
          # anchor and fails if any file on disk differs, catching a hand-edited generated file or a
          # tuning change nobody re-ran the generator for (spec-species-generator.md §7).
          dotnet run --project tools/DemonSpeciesGen -- --check
          if ($LASTEXITCODE -ne 0) { throw "DemonSpeciesGen --check found the generated tree stale — run 'dotnet run --project tools/DemonSpeciesGen' and commit the result" }

      - name: family-expand staleness guard (E43, spec-family-expand.md §3.1/§5 test 2)
        shell: pwsh
        run: |
          # FamilyExpandGen commits its generated tree (data/seed/atoms/generated/**) to the repo,
          # same DemonSpeciesGen --check pattern above — --check regenerates every atom row from the
          # 98 authored affix families + tier-bands.v1.json and fails if any generated file on disk
          # differs, or if a generated file's source family no longer exists.
          dotnet run --project tools/FamilyExpandGen -- --check
          if ($LASTEXITCODE -ne 0) { throw "FamilyExpandGen --check found the generated tree stale — run 'dotnet run --project tools/FamilyExpandGen' and commit the result" }

      - name: Balance guard (class-system-todo.md P5.3 — termination HARD, dominance-mechanism HARD, dominance-verdict SOFT)
        shell: pwsh
        run: |
          # Deliberately its OWN step, not folded into "Restore / test (.NET)" below: that step runs
          # ten `dotnet test` calls in one script with no exit-code check between them, so only the
          # LAST one determines the step's pass/fail (confirmed against a real CI run, 2026-08-24 —
          # Core.Tests and Guard.Tests both failed and were silently swallowed because E2E.Tests, the
          # last call, also happened to fail that day) — a guard whose whole job is "fail the build"
          # cannot share that step. See docs/architecture/class-system/spec-balance-guard.md §2/§5.
          #
          # Filters to `Category=BalanceGuard` only, NOT the wider `Category=BalanceGuardBaseline` --
          # that second trait marks the one DominanceGuardTests case that asserts a fact about TODAY'S
          # TUNING DATA (no dominant corner), not the guard's own mechanism. spec-balance-guard.md §2 is
          # explicit a dominance verdict must never fail the build; blocking on it here would silently
          # reintroduce exactly that violation the day the data legitimately goes red (e.g. a deliberate
          # Phase 8 residual-fit trade-off). `Category=BalanceGuard` covers TerminationGuard's own tests
          # (HARD by design — a violation SHOULD fail CI) and DominanceGuard's MECHANISM tests only
          # (returns without throwing, coverage populated, no clock applied — code regressions, safe to
          # block on regardless of what the verdict itself says).
          dotnet test tests/FusionRpg.Core.Tests/FusionRpg.Core.Tests.csproj -c Release --verbosity minimal --filter "Category=BalanceGuard"
          if ($LASTEXITCODE -ne 0) { throw "balance-guard: a termination invariant or dominance-guard-mechanism test failed — see output above" }

      - name: Restore / test (.NET)
        shell: pwsh
        run: |
          # Fixed 2026-09-01 (`seed-to-concrete` T0.8). This step used to run all ten `dotnet test`
          # calls with no exit-code check between them, so only the LAST call determined the step's
          # pass/fail — the exact defect the Balance-guard step's own comment above already documents
          # from a real CI run (2026-08-24: Core.Tests and Guard.Tests both failed and were silently
          # swallowed because E2E.Tests, the last call, also happened to fail that day). Every call
          # below now checks its own exit code and throws immediately, matching every other step in
          # this file — a failure in project #3 no longer waits to be masked by project #10.
          dotnet test tests/FusionRpg.Core.Tests/FusionRpg.Core.Tests.csproj -c Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.Tests failed" }
          dotnet test tests/FusionRpg.Data.Tests/FusionRpg.Data.Tests.csproj -c Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Data.Tests failed" }
          dotnet test tests/FusionRpg.CheatCore.Tests/FusionRpg.CheatCore.Tests.csproj -c Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.CheatCore.Tests failed" }
          dotnet test tests/FusionRpg.Guard.Tests/FusionRpg.Guard.Tests.csproj -c Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Guard.Tests failed" }
          dotnet test tests/FusionRpg.Launcher.Tests/FusionRpg.Launcher.Tests.csproj -c Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Launcher.Tests failed" }
          dotnet test tests/FusionRpg.ItemSeedValidator.Tests/FusionRpg.ItemSeedValidator.Tests.csproj -c Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.ItemSeedValidator.Tests failed" }
          dotnet test tests/FusionRpg.AtomImporter.Tests/FusionRpg.AtomImporter.Tests.csproj -c Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.AtomImporter.Tests failed" }
          dotnet test tests/FusionRpg.ElementEnumGen.Tests/FusionRpg.ElementEnumGen.Tests.csproj -c Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.ElementEnumGen.Tests failed" }
          dotnet test tests/FusionRpg.Server.Tests/FusionRpg.Server.Tests.csproj -c Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Server.Tests failed" }
          dotnet test tests/FusionRpg.E2E.Tests/FusionRpg.E2E.Tests.csproj -c Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.E2E.Tests failed" }

      - name: Boundary guards (AGENTS.md — combat writes, Secondary-Unity boundary, Funnel deltas, DAL)
        shell: pwsh
        run: |
          # Added 2026-09-01 (`seed-to-concrete` T0.8). These four scripts existed but were never
          # wired into CI — a violation only surfaced if someone ran them locally. Each runs as its
          # own individually-checked call, same discipline as the fix above: one script's failure
          # must not be masked by the next script still running.
          .\scripts\guard-single-writer.ps1
          if ($LASTEXITCODE -ne 0) { throw "guard-single-writer.ps1 failed — a combat write bypassed EntityStatWriter" }
          .\scripts\guard-secondary-no-unity.ps1
          if ($LASTEXITCODE -ne 0) { throw "guard-secondary-no-unity.ps1 failed — a Secondary plugin touched Unity" }
          .\scripts\guard-funnel-delta.ps1
          if ($LASTEXITCODE -ne 0) { throw "guard-funnel-delta.ps1 failed — an HP delta bypassed Funnel/FA10" }
          .\scripts\guard-dal.ps1
          if ($LASTEXITCODE -ne 0) { throw "guard-dal.ps1 failed — SQL appeared outside FusionRpg.Data" }

      - name: Content validation gate (E47)
        shell: pwsh
        run: |
          # Closes E24's B4 half (spec-validate-gate-ci.md) — AtomImporter --validate existed with
          # no CI caller, so ContentValidation.Lint/.Drift ran over the real shipped atom corpus in
          # nobody's pipeline. Runs against the REAL data/seed/ tree, never a fixture (§3.1) — a
          # gate over a fixture proves the gate works and nothing about the content.
          #
          # --db <scratch>: without it the tool resolves $FUSIONRPG_DATA, then walks up for
          # dist/FusionRpg.Server/data; a fresh CI checkout has neither, so the tool would exit 2
          # before reading a single seed file (Program.cs) — a gate that always exits 2 is a gate
          # nobody reads. --check: dry-run import (rolled back in one transaction) so the gate reads
          # the real corpus and writes nothing to a throwaway database.
          #
          # Finding policy (§3.2, decided 2026-09-03 — verified against ContentValidation's own
          # Blocking flags, not restated as new policy): a structural defect (unparseable file,
          # unknown kind, bad param, duplicate id) fails the import itself, upstream of --validate,
          # so it already fails this step with no gate logic needed. `drift` without a `powerNote`
          # is Blocking:true and fails. All seven lints (tier-gap, flat-tier, duplicate-affix,
          # backwards-interval, lonely-group, orphan, orphan-affix) and a noted `drift` are
          # Blocking:false by construction and only report. Budget checking stays out — no ceiling
          # data exists in the schema yet (rarity table has no budget column); A-G1 is what
          # introduces the first such data.
          dotnet run --project tools/AtomImporter -c Release -- --check --validate --db "$env:RUNNER_TEMP/atom-validate-db"
          if ($LASTEXITCODE -ne 0) { throw "content validation gate failed - see the lint / power drift lines above" }

      - name: Demon corpus dump is self-consistent (seed-to-concrete T1.2)
        shell: pwsh
        run: |
          # `--verify` is DB-free by design (spec-corpus-dump.md) — decisions.md rules out a real
          # game/Harmony in CI, so there is no populated hot.sqlite to regenerate the dump from
          # here. This re-hashes the committed payload files on disk and checks them against
          # _manifest.json's declared hash and counts — it catches a hand-edit or a bad merge, not
          # drift against the live game (that is the owner-run `--check` against a real database).
          dotnet run --project tools/DemonCorpusDump -c Release -- --verify data/seed/demons/_dump
          if ($LASTEXITCODE -ne 0) { throw "demon corpus dump under data/seed/demons/_dump is not self-consistent with its own manifest — see output above" }

      - name: Validate item seed corpus
        shell: pwsh
        run: |
          dotnet run --project tools/ItemSeedValidator -c Release
          if ($LASTEXITCODE -ne 0) { throw "item seed corpus failed validation" }

      - name: Install seedsmith from the lockfile (reproducible env)
        shell: pwsh
        working-directory: tools/seedsmith
        run: |
          # G0.1 (spec-dependency-baseline.md): seedsmith declared ZERO dependencies until
          # 2026-09-01, so this job ran against whatever the runner happened to have. `jieba` was
          # imported by adapters/demons/motifs.py and declared nowhere — a fresh clone failed
          # test_motif_derive.py with ModuleNotFoundError. Installing from the committed lockfile
          # makes the environment reproducible instead of ambient.
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "seedsmith lockfile install failed" }
          python -m pip install -e . --no-deps
          if ($LASTEXITCODE -ne 0) { throw "seedsmith editable install failed" }

      - name: Item seed reachability (seedsmith)
        shell: pwsh
        run: |
          # Cutover complete (tasks/seedsmith-todo.md, S10, 2026-08-23): `seedsmith` replaces
          # `seed_graph` as the reachability gate. Parity was proven byte-identical across every
          # distinct state this corpus has ever had — not one snapshot but all four: the current
          # HEAD and three earlier commits reachable via `git log -- data/seed/items/`, spanning
          # the corpus's growth from 102 files to its current size, extracted read-only via
          # `git archive` and diffed with test_parity_seed_graph.py's own comparison. That is the
          # evidence step 2's planned one-week soak period existed to gather — real drift the
          # corpus had already produced, not a calendar wait for drift that might not occur.
          #
          # Only the seven Linkage/Registration metrics ported from `seed_graph` were promoted to
          # gates=True for this cutover (`seedsmith/metrics/linkage.py`) — a verified
          # byte-identical replacement for a check that already gated CI unconditionally, not a
          # new, uncalibrated metric. Every other metric in the suite (Coverage, Distribution,
          # Balance, Constraint, ExemplarConformance, SemanticDedup, Quality) still starts
          # measure-only, per spec-metrics.md §4's normal calibration discipline.
          python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { throw "seedsmith's own test suite failed" }
          python -m seedsmith check --adapter items --gate ../../data/seed/items
          if ($LASTEXITCODE -ne 0) { throw "item seed corpus has reachability gaps" }
        working-directory: tools/seedsmith

      - name: Demon anchor contract audits clean (seed-to-concrete T1.7 / Checkpoint 1)
        shell: pwsh
        run: |
          # Mechanical, per spec-anchor-contract.md §4: a numeric field anywhere in the resolved
          # species-anchor schema poisons every downstream classification row, so this gates CI
          # unconditionally rather than starting measure-only like a balance metric would.
          python -m seedsmith demons contract --audit
          if ($LASTEXITCODE -ne 0) { throw "demon anchor contract has a numeric-smuggling finding — see output above" }
        working-directory: tools/seedsmith

      - name: Demon corpus-coverage metrics (seed-to-concrete T1.10)
        shell: pwsh
        run: |
          # --demon-dump only (no --corpus): isolates the two demon-dump metrics from the item
          # corpus's own EmptyPartition/Balance/Distribution families, which need a real --corpus
          # to mean anything and would otherwise report noise here.
          python -m seedsmith report --gate --demon-dump ../../data/seed/demons/_dump
          if ($LASTEXITCODE -ne 0) { throw "demon corpus-coverage metrics found a gated finding — see output above" }
        working-directory: tools/seedsmith

      - name: Demon preflight, CI mode (seed-to-concrete T1.8 — checks 1-4/7-9, no local model)
        shell: pwsh
        run: |
          # --skip-model is CI's own escape hatch (spec-dump-preflight.md's own Commands section)
          # and is never legal before a real generation run — run-control (module 9) refuses a
          # preflight record written with skipModel=true. This step only proves checks 1-4/7-9
          # stay green; it never authorizes a run.
          python -m seedsmith demons preflight --skip-model
          if ($LASTEXITCODE -ne 0) { throw "demon preflight (checks 1-4, 7-9) failed — see output above" }
        working-directory: tools/seedsmith

      - name: Web unit tests
        working-directory: web/fusion-rpg-web
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { npm install } else { npm ci }
          if ($LASTEXITCODE -ne 0) { throw "npm ci/install failed" }
          if (Test-Path package.json) {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            if ($pkg.scripts.test) { npm test; if ($LASTEXITCODE -ne 0) { throw "npm test failed" } }
            else { Write-Host "No npm test script; skipping web tests." }
          }

      - name: Web build
        working-directory: web/fusion-rpg-web
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed" }

      - name: Web bundle budget (GG-38 — Checkpoint G §19 check 13)
        working-directory: web/fusion-rpg-web
        shell: pwsh
        run: |
          npm run check:bundle
          if ($LASTEXITCODE -ne 0) { throw "entry chunk is over budget, or Phaser/recharts leaked into it — see output above" }

      - name: Web i18n catalog is current (Checkpoint G — lingui extract clean)
        working-directory: web/fusion-rpg-web
        shell: pwsh
        run: |
          npm run extract
          if ($LASTEXITCODE -ne 0) { throw "lingui extract failed" }
          $diff = git status --porcelain -- src/i18n/locales
          if ($diff) {
            Write-Host $diff
            throw "extracted i18n catalog is out of date — run 'npm run extract' in web/fusion-rpg-web and commit the result"
          }

      - name: Web e2e tests (Checkpoint G §19 checks 3/7/11 — reachability, axe, viewport)
        working-directory: web/fusion-rpg-web
        shell: pwsh
        run: |
          npx playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { throw "playwright browser install failed" }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw "playwright e2e tests failed" }
