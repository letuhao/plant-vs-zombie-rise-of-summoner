name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    # 2026-09-06: a real, reproduced .NET process-redirection deadlock (fixed the same day in
    # CreatureSpeciesImportCliTests.cs/RealColdProcessTests.cs) hung a local test run for 17+ minutes
    # with no diagnostic naming the stuck test. GitHub Actions' own default job timeout is 6 hours —
    # a future hang of this shape would silently burn most of a day's CI minutes before failing.
    # This bound is generous for the real runtime (normally well under it) and only exists to fail
    # fast with SOME signal rather than run to the platform default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # guard-generated-seed needs the commit's parent to build its diff; the default
          # depth-1 checkout has none, which would make the guard silently see no changes.
          fetch-depth: 2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: commit-tool policy smoke + history check
        shell: pwsh
        run: |
          python scripts/commit-tool/smoke_test.py
          if ($LASTEXITCODE -ne 0) { throw "commit-tool smoke failed" }
          python scripts/commit-tool/check_history.py --max 30
          if ($LASTEXITCODE -ne 0) { throw "commit-tool check_history failed — watermark/author policy" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/fusion-rpg-web/package-lock.json

      - name: Numeric-overflow guard (power-plan.md P0.6)
        shell: pwsh
        run: |
          python scripts/audit-overflow.py
          if ($LASTEXITCODE -ne 0) { throw "overflow audit found a critical finding — see output above" }

      - name: Magic-number guard (power-todo.md M.6)
        shell: pwsh
        run: |
          python scripts/audit-magic-numbers.py
          if ($LASTEXITCODE -ne 0) { throw "magic-number audit found an M1/M2 finding — see output above" }

      - name: resource-ownership drift guard (A-R1, spec-resource-ownership.md §5 test 3)
        shell: pwsh
        run: |
          # Regenerates the 166 resource.* aptitude edges from data/tuning/resource-ownership.v1.json
          # in memory and diffs them against the shipped aptitudes.v{n}.json — catches a hand-edited
          # resource edge or a table drifted out of sync with the shipped file.
          python tools/tuning/resource_ownership.py --check
          if ($LASTEXITCODE -ne 0) { throw "resource_ownership.py --check found drift — see output above" }

      - name: species-generator staleness guard (seed-to-concrete T4.5/Checkpoint 4)
        shell: pwsh
        run: |
          # species-generator (creature-seed module 12) commits its generated tree
          # (data/generated/creatures/**) to the repo — --check regenerates every real classified
          # anchor and fails if any file on disk differs, catching a hand-edited generated file or a
          # tuning change nobody re-ran the generator for (spec-species-generator.md §7).
          dotnet run --project tools/CreatureSpeciesGen -- --check
          if ($LASTEXITCODE -ne 0) { throw "CreatureSpeciesGen --check found the generated tree stale — run 'dotnet run --project tools/CreatureSpeciesGen' and commit the result" }

      - name: family-expand staleness guard (E43, spec-family-expand.md §3.1/§5 test 2)
        shell: pwsh
        run: |
          # FamilyExpandGen commits its generated tree (data/seed/atoms/generated/**) to the repo,
          # same CreatureSpeciesGen --check pattern above — --check regenerates every atom row from the
          # 98 authored affix families + tier-bands.v1.json and fails if any generated file on disk
          # differs, or if a generated file's source family no longer exists.
          dotnet run --project tools/FamilyExpandGen -- --check
          if ($LASTEXITCODE -ne 0) { throw "FamilyExpandGen --check found the generated tree stale — run 'dotnet run --project tools/FamilyExpandGen' and commit the result" }

      - name: species-build plan staleness guard (T1.8, spec-redistribution-plan.md §"Commands")
        shell: pwsh
        run: |
          # redistribution-plan (species-build module 4) commits its generated plan
          # (data/generated/creatures/_species-build-plan.json) to the repo, same CreatureSpeciesGen
          # --check pattern above — --check replans the whole real corpus and fails if the committed
          # file differs, OR if the replanned corpus falls outside the shipped parity band (Phase 3's
          # own refusal, exit 1) — a near-miss never ships silently.
          dotnet run --project tools/CreatureBuildPlanGen -- --check
          if ($LASTEXITCODE -ne 0) { throw "CreatureBuildPlanGen --check found the plan stale or out of band — run 'dotnet run --project tools/CreatureBuildPlanGen' and commit the result" }

      - name: passive-tree catalog staleness guard (H9, spec-tree-binder.md §"Commands")
        shell: pwsh
        run: |
          # tools/TreeBinder commits its generated catalog (data/generated/passive-tree/**) to the
          # repo, same CreatureSpeciesGen/FamilyExpandGen --check pattern above — --check rebinds every
          # committed plan+seed pair and fails if any generated file on disk differs. Distinct from
          # `seedsmith trees plan --check` (the PLAN's own byte-identity check, Python side, not yet
          # wired into this workflow either) — this is the CATALOG half, C# side, one step lower in
          # the pipeline (tree-plan -> tree-language -> tree-binder).
          dotnet run --project tools/TreeBinder -- --check
          if ($LASTEXITCODE -ne 0) { throw "TreeBinder --check found the generated catalog stale — run 'dotnet run --project tools/TreeBinder -- --seed data/seed/passive-tree --out data/generated/passive-tree' and commit the result" }

      - name: Balance guard (class-system-todo.md P5.3 — termination HARD, dominance-mechanism HARD, dominance-verdict SOFT)
        shell: pwsh
        run: |
          # `--blame-hang-timeout 10min` (raised from 5min 2026-09-12): the slowest legitimate
          # single test measured here is ~107s (Data.Tests ActionUnlockGrantWiringTests; Core.Tests
          # also has a ~105s case), so 10min leaves ~5x headroom. It was briefly raised to cover a
          # 3 x 120s retry loop in two cold-process tests; that retry was removed 2026-09-12 (those
          # tests now launch a prebuilt apphost in ~0.7s), but the cap stays for the 107s cases.
          # Keep this aligned with the test.runsettings TestTimeout so local and CI behave the same.
          #
          # Deliberately its OWN step, not folded into "Restore / test (.NET)" below: that step runs
          # ten `dotnet test` calls in one script with no exit-code check between them, so only the
          # LAST one determines the step's pass/fail (confirmed against a real CI run, 2026-08-24 —
          # Core.Tests and Guard.Tests both failed and were silently swallowed because E2E.Tests, the
          # last call, also happened to fail that day) — a guard whose whole job is "fail the build"
          # cannot share that step. See docs/architecture/class-system/spec-balance-guard.md §2/§5.
          #
          # Filters to `Category=BalanceGuard` only, NOT the wider `Category=BalanceGuardBaseline` --
          # that second trait marks the one DominanceGuardTests case that asserts a fact about TODAY'S
          # TUNING DATA (no dominant corner), not the guard's own mechanism. spec-balance-guard.md §2 is
          # explicit a dominance verdict must never fail the build; blocking on it here would silently
          # reintroduce exactly that violation the day the data legitimately goes red (e.g. a deliberate
          # Phase 8 residual-fit trade-off). `Category=BalanceGuard` covers TerminationGuard's own tests
          # (HARD by design — a violation SHOULD fail CI) and DominanceGuard's MECHANISM tests only
          # (returns without throwing, coverage populated, no clock applied — code regressions, safe to
          # block on regardless of what the verdict itself says).
          dotnet test tests/FusionRpg.Core.Tests/FusionRpg.Core.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min --filter "Category=BalanceGuard"
          if ($LASTEXITCODE -ne 0) { throw "balance-guard: a termination invariant or dominance-guard-mechanism test failed — see output above" }

      - name: Restore / test (.NET)
        shell: pwsh
        run: |
          # Fixed 2026-09-01 (`seed-to-concrete` T0.8). This step used to run all ten `dotnet test`
          # calls with no exit-code check between them, so only the LAST call determined the step's
          # pass/fail — the exact defect the Balance-guard step's own comment above already documents
          # from a real CI run (2026-08-24: Core.Tests and Guard.Tests both failed and were silently
          # swallowed because E2E.Tests, the last call, also happened to fail that day). Every call
          # below now checks its own exit code and throws immediately, matching every other step in
          # this file — a failure in project #3 no longer waits to be masked by project #10.
          dotnet test tests/FusionRpg.Core.Tests/FusionRpg.Core.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.Tests failed" }
          dotnet test tests/FusionRpg.Data.Tests/FusionRpg.Data.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Data.Tests failed" }
          dotnet test tests/FusionRpg.CheatCore.Tests/FusionRpg.CheatCore.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.CheatCore.Tests failed" }
          dotnet test tests/FusionRpg.Guard.Tests/FusionRpg.Guard.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Guard.Tests failed" }
          dotnet test tests/FusionRpg.Launcher.Tests/FusionRpg.Launcher.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Launcher.Tests failed" }
          dotnet test tests/FusionRpg.ItemSeedValidator.Tests/FusionRpg.ItemSeedValidator.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.ItemSeedValidator.Tests failed" }
          dotnet test tests/FusionRpg.AtomImporter.Tests/FusionRpg.AtomImporter.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.AtomImporter.Tests failed" }
          dotnet test tests/FusionRpg.ElementEnumGen.Tests/FusionRpg.ElementEnumGen.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.ElementEnumGen.Tests failed" }
          # Wired in 2026-09-06 (seed-to-concrete) -- found never in CI via CiWiringGuardTests, verified
          # green in isolation before adding (FusionRpg.PassiveTreeRosterGen.Tests held back: one
          # pre-existing, unrelated content-drift failure at the time -- data/seed/statuses/roster.json
          # is stale against a "nerve" status family another stream added; not this program's to fix).
          dotnet test tests/FusionRpg.SquadHarness.Tests/FusionRpg.SquadHarness.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.SquadHarness.Tests failed" }
          dotnet test tests/FusionRpg.TreeBinder.Tests/FusionRpg.TreeBinder.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.TreeBinder.Tests failed" }
          dotnet test tests/FusionRpg.Server.Tests/FusionRpg.Server.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Server.Tests failed" }
          dotnet test tests/FusionRpg.E2E.Tests/FusionRpg.E2E.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.E2E.Tests failed" }

      - name: Boundary guards (AGENTS.md — combat writes, Secondary-Unity boundary, Funnel deltas, DAL)
        shell: pwsh
        run: |
          # Added 2026-09-01 (`seed-to-concrete` T0.8). These four scripts existed but were never
          # wired into CI — a violation only surfaced if someone ran them locally. Each runs as its
          # own individually-checked call, same discipline as the fix above: one script's failure
          # must not be masked by the next script still running.
          .\scripts\guard-single-writer.ps1
          if ($LASTEXITCODE -ne 0) { throw "guard-single-writer.ps1 failed — a combat write bypassed EntityStatWriter" }
          .\scripts\guard-secondary-no-unity.ps1
          if ($LASTEXITCODE -ne 0) { throw "guard-secondary-no-unity.ps1 failed — a Secondary plugin touched Unity" }
          .\scripts\guard-funnel-delta.ps1
          if ($LASTEXITCODE -ne 0) { throw "guard-funnel-delta.ps1 failed — an HP delta bypassed Funnel/FA10" }

          .\scripts\guard-actor-hub.ps1
          if ($LASTEXITCODE -ne 0) { throw "guard-actor-hub.ps1 failed — actor compose bypassed ActorHub" }
          .\scripts\guard-dal.ps1
          if ($LASTEXITCODE -ne 0) { throw "guard-dal.ps1 failed — SQL appeared outside FusionRpg.Data" }
          .\scripts\guard-test-substrate.ps1
          if ($LASTEXITCODE -ne 0) { throw "guard-test-substrate.ps1 failed — a test leaked a temp store or swallowed a temp-delete" }
          # Generated seed is regenerated, never hand-edited (AGENTS.md / CLAUDE.md hard rule).
          # Compare the pushed commit against its parent; a single-commit depth or a root commit
          # falls back to inspecting the working tree, which is clean on CI.
          $seedRange = if (git rev-parse --verify HEAD~1 2>$null) { "HEAD~1..HEAD" } else { $null }
          if ($seedRange) { .\scripts\guard-generated-seed.ps1 -Range $seedRange }
          else { .\scripts\guard-generated-seed.ps1 }
          if ($LASTEXITCODE -ne 0) { throw "guard-generated-seed.ps1 failed — a generated seed file was hand-edited without changing its generator" }

      - name: Content validation gate (E47)
        shell: pwsh
        run: |
          # Closes E24's B4 half (spec-validate-gate-ci.md) — AtomImporter --validate existed with
          # no CI caller, so ContentValidation.Lint/.Drift ran over the real shipped atom corpus in
          # nobody's pipeline. Runs against the REAL data/seed/ tree, never a fixture (§3.1) — a
          # gate over a fixture proves the gate works and nothing about the content.
          #
          # --db <scratch>: without it the tool resolves $FUSIONRPG_DATA, then walks up for
          # dist/FusionRpg.Server/data; a fresh CI checkout has neither, so the tool would exit 2
          # before reading a single seed file (Program.cs) — a gate that always exits 2 is a gate
          # nobody reads. --check: dry-run import (rolled back in one transaction) so the gate reads
          # the real corpus and writes nothing to a throwaway database.
          #
          # Finding policy (§3.2, decided 2026-09-03 — verified against ContentValidation's own
          # Blocking flags, not restated as new policy): a structural defect (unparseable file,
          # unknown kind, bad param, duplicate id) fails the import itself, upstream of --validate,
          # so it already fails this step with no gate logic needed. `drift` without a `powerNote`
          # is Blocking:true and fails. All seven lints (tier-gap, flat-tier, duplicate-affix,
          # backwards-interval, lonely-group, orphan, orphan-affix) and a noted `drift` are
          # Blocking:false by construction and only report. Budget checking stays out — no ceiling
          # data exists in the schema yet (rarity table has no budget column); A-G1 is what
          # introduces the first such data.
          dotnet run --project tools/AtomImporter -c Release -- --check --validate --db "$env:RUNNER_TEMP/atom-validate-db"
          if ($LASTEXITCODE -ne 0) { throw "content validation gate failed - see the lint / power drift lines above" }

      - name: Creature corpus dump is self-consistent (seed-to-concrete T1.2)
        shell: pwsh
        run: |
          # `--verify` is DB-free by design (spec-corpus-dump.md) — decisions.md rules out a real
          # game/Harmony in CI, so there is no populated hot.sqlite to regenerate the dump from
          # here. This re-hashes the committed payload files on disk and checks them against
          # _manifest.json's declared hash and counts — it catches a hand-edit or a bad merge, not
          # drift against the live game (that is the owner-run `--check` against a real database).
          dotnet run --project tools/CreatureCorpusDump -c Release -- --verify data/seed/creatures/_dump
          if ($LASTEXITCODE -ne 0) { throw "creature corpus dump under data/seed/creatures/_dump is not self-consistent with its own manifest — see output above" }

      - name: Validate item seed corpus
        shell: pwsh
        run: |
          dotnet run --project tools/ItemSeedValidator -c Release
          if ($LASTEXITCODE -ne 0) { throw "item seed corpus failed validation" }

      - name: Install seedsmith from the lockfile (reproducible env)
        shell: pwsh
        working-directory: tools/seedsmith
        run: |
          # G0.1 (spec-dependency-baseline.md): seedsmith declared ZERO dependencies until
          # 2026-09-01, so this job ran against whatever the runner happened to have. `jieba` was
          # imported by adapters/creatures/motifs.py and declared nowhere — a fresh clone failed
          # test_motif_derive.py with ModuleNotFoundError. Installing from the committed lockfile
          # makes the environment reproducible instead of ambient.
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "seedsmith lockfile install failed" }
          python -m pip install -e . --no-deps
          if ($LASTEXITCODE -ne 0) { throw "seedsmith editable install failed" }

      - name: Item seed reachability (seedsmith)
        shell: pwsh
        run: |
          # Cutover complete (tasks/seedsmith-todo.md, S10, 2026-08-23): `seedsmith` replaces
          # `seed_graph` as the reachability gate. Parity was proven byte-identical across every
          # distinct state this corpus has ever had — not one snapshot but all four: the current
          # HEAD and three earlier commits reachable via `git log -- data/seed/items/`, spanning
          # the corpus's growth from 102 files to its current size, extracted read-only via
          # `git archive` and diffed with test_parity_seed_graph.py's own comparison. That is the
          # evidence step 2's planned one-week soak period existed to gather — real drift the
          # corpus had already produced, not a calendar wait for drift that might not occur.
          #
          # Only the seven Linkage/Registration metrics ported from `seed_graph` were promoted to
          # gates=True for this cutover (`seedsmith/metrics/linkage.py`) — a verified
          # byte-identical replacement for a check that already gated CI unconditionally, not a
          # new, uncalibrated metric. Every other metric in the suite (Coverage, Distribution,
          # Balance, Constraint, ExemplarConformance, SemanticDedup, Quality) still starts
          # measure-only, per spec-metrics.md §4's normal calibration discipline.
          python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { throw "seedsmith's own test suite failed" }
          python -m seedsmith check --adapter items --gate ../../data/seed/items
          if ($LASTEXITCODE -ne 0) { throw "item seed corpus has reachability gaps" }
        working-directory: tools/seedsmith

      - name: Creature anchor contract audits clean (seed-to-concrete T1.7 / Checkpoint 1)
        shell: pwsh
        run: |
          # Mechanical, per spec-anchor-contract.md §4: a numeric field anywhere in the resolved
          # species-anchor schema poisons every downstream classification row, so this gates CI
          # unconditionally rather than starting measure-only like a balance metric would.
          python -m seedsmith creatures contract --audit
          if ($LASTEXITCODE -ne 0) { throw "creature anchor contract has a numeric-smuggling finding — see output above" }
        working-directory: tools/seedsmith

      - name: Structure anchor contract audits clean (base-defense structure-schema, module 23)
        shell: pwsh
        run: |
          # Mechanical, per spec-structure-schema.md §4: the module's whole point is that this audit
          # fails the build rather than warning, so it gates CI unconditionally, the same way the
          # creature anchor contract step above does for its own schema.
          python -m seedsmith structures contract --audit
          if ($LASTEXITCODE -ne 0) { throw "structure anchor contract has a numeric-smuggling finding — see output above" }
        working-directory: tools/seedsmith

      - name: Creature corpus-coverage metrics (seed-to-concrete T1.10)
        shell: pwsh
        run: |
          # --creature-dump only (no --corpus): isolates the two creature-dump metrics from the item
          # corpus's own EmptyPartition/Balance/Distribution families, which need a real --corpus
          # to mean anything and would otherwise report noise here.
          python -m seedsmith report --gate --creature-dump ../../data/seed/creatures/_dump
          if ($LASTEXITCODE -ne 0) { throw "creature corpus-coverage metrics found a gated finding — see output above" }
        working-directory: tools/seedsmith

      - name: Creature roster metrics gate (seed-to-concrete T2.10/T2.12/Checkpoint 2)
        shell: pwsh
        run: |
          # T2.12's own original note said this would "break CI with no anchor tree yet" — stale as
          # of 2026-09-06: the real anchor tree (data/seed/creatures/species/**, 504 tracked files,
          # 829-840 real classified species depending on which run) has been committed for a while
          # now, and this command needs no model call and no network access, only the committed
          # tree + data/tuning/creature-roster-targets.v1.json. Verified directly before wiring it in,
          # not assumed: run against the real committed tree, exits 0 (14 real GAP findings, all
          # `gates=False` informational — none `gates=True`), so wiring it in cannot break the build
          # today. If a future roster change ever DOES trip an armed gate, that is this step doing
          # its job, not a regression in this step itself.
          python -m seedsmith creatures metrics --gate
          if ($LASTEXITCODE -ne 0) { throw "creature roster metrics found a gated finding — see output above" }
        working-directory: tools/seedsmith

      - name: Fusion-recipe seed staleness guard (creature-seed module 17/T8.3, spec-fusion-recipe-generator.md §3)
        shell: pwsh
        run: |
          # Same CreatureSpeciesGen/CreatureBuildPlanGen --check pattern above, for the one link in this
          # chain that did NOT have its own explicit gate until 2026-09-07: fusion-recipe-reconcile
          # commits data/generated/creatures/_fusion-recipes.json to the repo, and growing the species
          # corpus (a new anchor, a self-heal fallback resolving a field, a tuning change) can shift
          # which species are eligible fusion outputs/inputs without anyone touching this file by
          # hand. Found live the hard way: creature-corpus-self-heal Phase I's aptitudePrimary fallback
          # (11 species) silently desynced this exact committed seed (709->713 eligible outputs,
          # 695->699 deterministic recipes) until a full test run caught it by accident. `--check`
          # re-runs the real deterministic pass AND reuses (never re-derives) every already-resolved
          # gap-fill pick via its own per-deficit corpusContentHash freeze, so this never needs a
          # live model call to stay green — a real drift always has a one-line fix: re-run
          # `python -m seedsmith.adapters.creatures.fusion.reconcile` and commit the result.
          python -m seedsmith.adapters.creatures.fusion.reconcile --check
          if ($LASTEXITCODE -ne 0) { throw "fusion-recipe seed is stale — run 'python -m seedsmith.adapters.creatures.fusion.reconcile' (from tools/seedsmith) and commit the result" }
        working-directory: tools/seedsmith

      - name: Creature preflight, CI mode (seed-to-concrete T1.8 — checks 1-4/7-9, no local model)
        shell: pwsh
        run: |
          # --skip-model is CI's own escape hatch (spec-dump-preflight.md's own Commands section)
          # and is never legal before a real generation run — run-control (module 9) refuses a
          # preflight record written with skipModel=true. This step only proves checks 1-4/7-9
          # stay green; it never authorizes a run.
          python -m seedsmith creatures preflight --skip-model
          if ($LASTEXITCODE -ne 0) { throw "creature preflight (checks 1-4, 7-9) failed — see output above" }
        working-directory: tools/seedsmith

      - name: Web unit tests
        working-directory: web/fusion-rpg-web
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { npm install } else { npm ci }
          if ($LASTEXITCODE -ne 0) { throw "npm ci/install failed" }
          if (Test-Path package.json) {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            if ($pkg.scripts.test) { npm test; if ($LASTEXITCODE -ne 0) { throw "npm test failed" } }
            else { Write-Host "No npm test script; skipping web tests." }
          }

      - name: Web build
        working-directory: web/fusion-rpg-web
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed" }

      - name: Web bundle budget (GG-38 — Checkpoint G §19 check 13)
        working-directory: web/fusion-rpg-web
        shell: pwsh
        run: |
          npm run check:bundle
          if ($LASTEXITCODE -ne 0) { throw "entry chunk is over budget, or Phaser/recharts leaked into it — see output above" }

      - name: Web i18n catalog is current (Checkpoint G — lingui extract clean)
        working-directory: web/fusion-rpg-web
        shell: pwsh
        run: |
          npm run extract
          if ($LASTEXITCODE -ne 0) { throw "lingui extract failed" }
          $diff = git status --porcelain -- src/i18n/locales
          if ($diff) {
            Write-Host $diff
            throw "extracted i18n catalog is out of date — run 'npm run extract' in web/fusion-rpg-web and commit the result"
          }

      - name: Web e2e tests (Checkpoint G §19 checks 3/7/11 — reachability, axe, viewport)
        working-directory: web/fusion-rpg-web
        shell: pwsh
        run: |
          npx playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { throw "playwright browser install failed" }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw "playwright e2e tests failed" }
