name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/fusion-rpg-web/package-lock.json

      - name: Restore / test (.NET)
        shell: pwsh
        run: |
          dotnet test tests/FusionRpg.Core.Tests/FusionRpg.Core.Tests.csproj -c Release --verbosity minimal
          dotnet test tests/FusionRpg.Data.Tests/FusionRpg.Data.Tests.csproj -c Release --verbosity minimal
          dotnet test tests/FusionRpg.CheatCore.Tests/FusionRpg.CheatCore.Tests.csproj -c Release --verbosity minimal
          dotnet test tests/FusionRpg.Guard.Tests/FusionRpg.Guard.Tests.csproj -c Release --verbosity minimal
          dotnet test tests/FusionRpg.Launcher.Tests/FusionRpg.Launcher.Tests.csproj -c Release --verbosity minimal
          dotnet test tests/FusionRpg.ItemSeedValidator.Tests/FusionRpg.ItemSeedValidator.Tests.csproj -c Release --verbosity minimal
          dotnet test tests/FusionRpg.AtomImporter.Tests/FusionRpg.AtomImporter.Tests.csproj -c Release --verbosity minimal
          dotnet test tests/FusionRpg.ElementEnumGen.Tests/FusionRpg.ElementEnumGen.Tests.csproj -c Release --verbosity minimal
          dotnet test tests/FusionRpg.Server.Tests/FusionRpg.Server.Tests.csproj -c Release --verbosity minimal
          dotnet test tests/FusionRpg.E2E.Tests/FusionRpg.E2E.Tests.csproj -c Release --verbosity minimal

      - name: Validate item seed corpus
        shell: pwsh
        run: |
          dotnet run --project tools/ItemSeedValidator -c Release
          if ($LASTEXITCODE -ne 0) { throw "item seed corpus failed validation" }

      - name: Item seed reachability (seedsmith)
        shell: pwsh
        run: |
          # Cutover complete (tasks/seedsmith-todo.md, S10, 2026-08-23): `seedsmith` replaces
          # `seed_graph` as the reachability gate. Parity was proven byte-identical across every
          # distinct state this corpus has ever had — not one snapshot but all four: the current
          # HEAD and three earlier commits reachable via `git log -- data/seed/items/`, spanning
          # the corpus's growth from 102 files to its current size, extracted read-only via
          # `git archive` and diffed with test_parity_seed_graph.py's own comparison. That is the
          # evidence step 2's planned one-week soak period existed to gather — real drift the
          # corpus had already produced, not a calendar wait for drift that might not occur.
          #
          # Only the seven Linkage/Registration metrics ported from `seed_graph` were promoted to
          # gates=True for this cutover (`seedsmith/metrics/linkage.py`) — a verified
          # byte-identical replacement for a check that already gated CI unconditionally, not a
          # new, uncalibrated metric. Every other metric in the suite (Coverage, Distribution,
          # Balance, Constraint, ExemplarConformance, SemanticDedup, Quality) still starts
          # measure-only, per spec-metrics.md §4's normal calibration discipline.
          python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { throw "seedsmith's own test suite failed" }
          python -m seedsmith check --adapter items --gate ../../data/seed/items
          if ($LASTEXITCODE -ne 0) { throw "item seed corpus has reachability gaps" }
        working-directory: tools/seedsmith

      - name: Web unit tests
        working-directory: web/fusion-rpg-web
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { npm install } else { npm ci }
          if ($LASTEXITCODE -ne 0) { throw "npm ci/install failed" }
          if (Test-Path package.json) {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            if ($pkg.scripts.test) { npm test; if ($LASTEXITCODE -ne 0) { throw "npm test failed" } }
            else { Write-Host "No npm test script; skipping web tests." }
          }
