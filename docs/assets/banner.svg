    <text x="62" y="206" font-size="78" font-weight="bold" fill="#f2ead8" textLength="322" lengthAdjust="spacingAndGlyphs">RISE OF</text>
    <text x="62" y="284" font-size="78" font-weight="bold" fill="#e0b44b" textLength="524" lengthAdjust="spacingAndGlyphs">SUMMONER</text>
    <text x="64" y="352" font-size="22" fill="#c9bca6">Command demons. Hold the lawn. Take back the multiverse.</text>
    <text x="216" y="398" font-size="13" letter-spacing="2.4" fill="#7d7060">SIX ELEMENTS &#183; A LIVING ROSTER &#183; A WAR MAP</text>
  </g>

