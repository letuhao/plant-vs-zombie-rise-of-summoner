<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Rise of Summoner — command demons, hold the lawn, take back the multiverse">
  <defs>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1712"/>
      <stop offset="0.55" stop-color="#16120e"/>
      <stop offset="1" stop-color="#0e0b09"/>
    </linearGradient>
    <radialGradient id="riftGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a8f62" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#3d6b45" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3d6b45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0b44b" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#e0b44b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#100d0a" stop-opacity="0.97"/>
      <stop offset="0.62" stop-color="#100d0a" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#100d0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laneFade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#16120e" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="440" fill="url(#soil)"/>
  <circle cx="988" cy="175" r="215" fill="url(#riftGlow)"/>

